[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nodal"
description = "Industry-neutral industrial logistics network optimizer"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "ortools>=9.12",
    "pydantic>=2.9",
    "typer>=0.15",
    "pyyaml>=6.0",
    "zstandard>=0.23",
    "tzdata>=2025.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.115",
    "mypy>=1.14",
    "ruff>=0.9",
    "types-PyYAML",
]
# The API layer (§11) is optional: the engine never depends on it, and the
# engine test suite passes with server/ absent.
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[project.scripts]
nodal = "nodal.cli:main"

[project.entry-points."nodal.packs"]
core = "packs.core:PACK"
coldchain = "packs.coldchain:PACK"
chem = "packs.chem:PACK"

[tool.hatch.version]
path = "nodal/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["nodal", "packs"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
# The scripts are shipped and runnable, so CI typechecks them alongside the engine.
files = ["nodal", "packs", "scripts"]
exclude = ["build/"]

[[tool.mypy.overrides]]
module = "ortools.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not bench'"
markers = [
    "bench: heavier benchmark-scenario tests (run explicitly: pytest -m bench)",
]
