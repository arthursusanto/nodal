# Demo world for the browser walkthrough (§11): nine US facilities, mixed
# capabilities (cold chain, hazmat), stocked zones, demand rates, a queue of
# planned shipments across all three verticals, and one upcoming capacity cut.
#
#   nodal world load worlds/demo.yaml --db var/demo.sqlite3
#   python -m server --db var/demo.sqlite3
#   cd web && npm install && npm run dev     ->  http://localhost:5173
start: 2026-09-01T00:00:00+00:00

